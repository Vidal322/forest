<!doctype html>
<html lang="pt-PT">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<title>Pintar — plantação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&amp;family=Alegreya:ital,wght@1,400;1,500;1,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2C4A3A}a:hover{color:#1F2A24}
</style>
</head>
<body style="margin:0;background:#C9CDBE;display:flex;justify-content:center">
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #4F5A36; color: #1F2A24; font-family: 'Atkinson Hyperlegible Next', sans-serif">

  <svg viewBox="60 400 400 200" width="390" height="200" role="img" aria-label="Covas de outubro e Linha do caminho pintadas para plantar" preserveAspectRatio="xMidYMid slice" style="position: absolute; left: 0; top: 0; display: block">
    <defs>
      <filter id="p3-soil" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="4" seed="11"></feTurbulence><feColorMatrix values="0.30 0 0 0 0.30  0.25 0 0 0 0.33  0.10 0 0 0 0.20  0 0 0 0 1"></feColorMatrix></filter>
    </defs>
    <rect x="0" y="300" width="600" height="400" filter="url(#p3-soil)"></rect>
    <g fill="#2E3B22" opacity="0.85"><circle cx="210" cy="400" r="10"></circle><circle cx="430" cy="380" r="15"></circle><circle cx="470" cy="560" r="18"></circle></g>
    <polygon points="225,420 420,410 430,560 235,580" fill="#3E8E3A" fill-opacity="0.6" stroke="#FFFFFF" stroke-width="3"></polygon>
    <polygon points="90,450 180,440 190,560 100,560" fill="#3E8E3A" fill-opacity="0.6" stroke="#FFFFFF" stroke-width="3"></polygon>
    <g font-family="Alegreya" font-style="italic" font-weight="700" font-size="17" fill="#FFFFFF" stroke="#1E2416" stroke-width="4" stroke-opacity="0.75" paint-order="stroke" text-anchor="middle">
      <text x="328" y="500">Covas de outubro</text><text x="143" y="505">Linha do caminho</text>
    </g>
  </svg>

  <section aria-labelledby="p3-title" style="position: absolute; left: 0; right: 0; top: 168px; bottom: 0; background: #FFFFFF; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 12px 16px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 4px; margin-left: -8px">
      <a href="regar.html" aria-label="Voltar às zonas pintadas" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F2A24" stroke-width="2.4" aria-hidden="true"><path d="M15 4l-8 8 8 8"></path></svg></a>
      <h1 id="p3-title" style="margin: 0; font-size: 22px; font-weight: 700">Plantar em 2 zonas</h1>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <h2 style="margin: 0 0 2px; font-size: 16px; font-weight: 700">Quantas árvores?</h2>
      <div style="display: flex; align-items: center; gap: 10px; min-height: 56px; border-bottom: 1px solid #E2E6D8">
        <span style="flex: 1; font-family: 'Alegreya', serif; font-style: italic; font-weight: 700; font-size: 19px">Covas de outubro</span>
        <button type="button" aria-label="Menos uma árvore em Covas de outubro" style="width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid #8A947F; background: #FFFFFF; font: 700 20px 'Atkinson Hyperlegible Next', sans-serif; color: #1F2A24">−</button>
        <label style="display: block"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Árvores em Covas de outubro</span>
          <input type="number" value="32" inputmode="numeric" style="width: 64px; height: 44px; box-sizing: border-box; text-align: center; border: 1.5px solid #2C4A3A; border-radius: 12px; font: 700 18px 'Atkinson Hyperlegible Next', sans-serif; color: #1F2A24"></label>
        <button type="button" aria-label="Mais uma árvore em Covas de outubro" style="width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid #8A947F; background: #FFFFFF; font: 700 20px 'Atkinson Hyperlegible Next', sans-serif; color: #1F2A24">+</button>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; min-height: 56px; border-bottom: 1px solid #E2E6D8">
        <span style="flex: 1; font-family: 'Alegreya', serif; font-style: italic; font-weight: 700; font-size: 19px">Linha do caminho</span>
        <button type="button" aria-label="Menos uma árvore em Linha do caminho" style="width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid #8A947F; background: #FFFFFF; font: 700 20px 'Atkinson Hyperlegible Next', sans-serif; color: #1F2A24">−</button>
        <label style="display: block"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Árvores em Linha do caminho</span>
          <input type="number" value="12" inputmode="numeric" style="width: 64px; height: 44px; box-sizing: border-box; text-align: center; border: 1.5px solid #2C4A3A; border-radius: 12px; font: 700 18px 'Atkinson Hyperlegible Next', sans-serif; color: #1F2A24"></label>
        <button type="button" aria-label="Mais uma árvore em Linha do caminho" style="width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid #8A947F; background: #FFFFFF; font: 700 20px 'Atkinson Hyperlegible Next', sans-serif; color: #1F2A24">+</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 16px; font-weight: 700">Que espécies?</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <span style="display: inline-flex; align-items: center; gap: 4px"><button type="button" aria-pressed="true" style="height: 44px; padding: 0 12px; border-radius: 12px; border: 0; background: #2C4A3A; color: #FFFFFF; font: 700 15px 'Atkinson Hyperlegible Next', sans-serif">sobreiro</button><input type="number" value="28" aria-label="Quantos sobreiros?" style="width: 52px; height: 44px; box-sizing: border-box; border: 1.5px solid #2C4A3A; border-radius: 12px; text-align: center; font: 700 15px 'Atkinson Hyperlegible Next', sans-serif; color: #1F2A24"></span>
        <span style="display: inline-flex; align-items: center; gap: 4px"><button type="button" aria-pressed="true" style="height: 44px; padding: 0 12px; border-radius: 12px; border: 0; background: #2C4A3A; color: #FFFFFF; font: 700 15px 'Atkinson Hyperlegible Next', sans-serif">castanheiro</button><input type="number" value="16" aria-label="Quantos castanheiros?" style="width: 52px; height: 44px; box-sizing: border-box; border: 1.5px solid #2C4A3A; border-radius: 12px; text-align: center; font: 700 15px 'Atkinson Hyperlegible Next', sans-serif; color: #1F2A24"></span>
        <button type="button" aria-pressed="false" style="height: 44px; padding: 0 12px; border-radius: 12px; border: 1.5px solid #8A947F; background: #FFFFFF; font: 500 15px 'Atkinson Hyperlegible Next', sans-serif; color: #1F2A24">medronheiro</button>
        <button type="button" aria-pressed="false" style="height: 44px; padding: 0 12px; border-radius: 12px; border: 1.5px solid #8A947F; background: #FFFFFF; font: 500 15px 'Atkinson Hyperlegible Next', sans-serif; color: #1F2A24">carvalho-alvarinho</button>
        <button type="button" aria-pressed="false" style="height: 44px; padding: 0 12px; border-radius: 12px; border: 1.5px solid #8A947F; background: #FFFFFF; font: 500 15px 'Atkinson Hyperlegible Next', sans-serif; color: #1F2A24">pinheiro-manso</button>
      </div>
      <p style="margin: 0; font-size: 14px; color: #2C4A3A; display: flex; align-items: center; gap: 6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2C4A3A" stroke-width="2.6" aria-hidden="true"><path d="M4 12l5 5L20 6"></path></svg>
        Todas as 44 árvores têm espécie</p>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; font-size: 15px; border-top: 1px solid #E2E6D8; padding-top: 10px">
      <span>Hoje, 22 de novembro</span><span style="flex: 1"></span>
      <a href="#" style="font-weight: 700; min-height: 44px; display: inline-flex; align-items: center">Mudar o dia</a>
    </div>
    <a href="#" style="font-size: 15px; font-weight: 700; align-self: flex-start; min-height: 44px; display: inline-flex; align-items: center">Acrescentar uma nota</a>

    <span style="flex: 1"></span>
    <a href="mapa.html" style="height: 56px; border-radius: 16px; background: #2C4A3A; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700">Guardar plantação</a>
  </section>
</div>
</body>
</html>
